name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Monorepo JS/TS: install, type-check y tests ──────────────────────────────
  node:
    name: Type-check & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check (core)
        run: bun run --filter=@jojos/core type-check

      - name: Type-check (mobile)
        run: bun run --filter=mobile type-check

      - name: Type-check (web)
        run: bun run --filter=web type-check

      - name: Unit tests (core)
        run: bun test packages/core

  # ── Backend Python: sintaxis e import de la app ──────────────────────────────
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import & route smoke test
        working-directory: backend
        env:
          SUPABASE_JWT_SECRET: test-secret-please-change-in-prod
          GEMINI_API_KEY: fake-key-for-ci
        run: |
          python -c "from app.main import app; print('app OK')"
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          assert c.get('/health').status_code == 200
          # El OCR debe exigir autenticación.
          assert c.post('/ocr/receipt', json={'image_base64':'aGk=','mime_type':'image/jpeg'}).status_code in (401, 403)
          print('backend smoke OK')
          PY

  # ── Migraciones SQL: aplicar el schema completo sobre Postgres ───────────────
  sql:
    name: SQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Apply schema + migrations
        env:
          PGPASSWORD: postgres
        run: |
          PSQL="psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q"
          # Shims de objetos que Supabase provee (auth, storage, roles).
          $PSQL <<'SQL'
          create schema if not exists auth;
          create schema if not exists storage;
          create extension if not exists pgcrypto;
          do $$ begin
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated; end if;
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role; end if;
          end $$;
          create table if not exists auth.users (id uuid primary key default gen_random_uuid(), email text, raw_user_meta_data jsonb default '{}'::jsonb);
          create or replace function auth.uid() returns uuid language sql stable as $fn$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $fn$;
          create table if not exists storage.objects (id uuid primary key default gen_random_uuid(), bucket_id text, owner uuid, name text);
          do $blk$ begin if not exists (select 1 from pg_publication where pubname='supabase_realtime') then create publication supabase_realtime; end if; end $blk$;
          SQL
          for f in supabase/schema.sql supabase/migration_v2.sql supabase/migration_v3.sql supabase/migration_v4.sql supabase/migration_v5_security.sql; do
            echo "Applying $f"
            $PSQL -f "$f"
          done
          echo "Todas las migraciones aplicaron sin error."
