name: Plata
options:
  bundleIdPrefix: com.plata
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

targets:
  Plata:
    type: application
    platform: iOS
    sources:
      - path: Plata
    # Info.plist explícito (gestionado por XcodeGen): la generación automática no
    # soporta el dict anidado UILaunchScreen → UIColorName, y sin él el launch
    # screen sale blanco (flash al abrir). Aquí se fija el fondo del launch al
    # color de marca (#141119) para que el arranque sea del color de la app.
    info:
      path: Plata/Info.plist
      properties:
        CFBundleDisplayName: Plata
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSCameraUsageDescription: "Plata usa la cámara para escanear recibos y códigos QR de invitación."
        NSPhotoLibraryUsageDescription: "Plata accede a tus fotos para adjuntar recibos."
        NSMicrophoneUsageDescription: "Plata usa el micrófono para registrar movimientos dictándolos por voz."
        NSSpeechRecognitionUsageDescription: "Plata transcribe lo que dictas para autocompletar el movimiento."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plata.finance
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Plata/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
