# Blueprint de Render para el backend FastAPI de Plata Finance.
# En Render: New → Blueprint → conecta este repo. Detecta este archivo y crea el servicio.
# Luego rellena las variables marcadas como sync:false en el dashboard.
services:
  - type: web
    name: plata-finance-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_JWT_SECRET
        sync: false   # Supabase → Settings → API → JWT Secret
      - key: GEMINI_API_KEY
        sync: false   # clave de Gemini (server-side) — OCR de recibos
      - key: ANTHROPIC_API_KEY
        sync: false   # clave de Claude (server-side) — parseo del dictado por voz
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false   # opcional: orígenes web separados por coma (la app móvil no necesita CORS)
